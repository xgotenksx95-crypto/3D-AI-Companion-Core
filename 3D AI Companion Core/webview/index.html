<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI Companion Core</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="status"><span class="dot" id="ws-dot"></span><span id="ws-text">Connecting...</span></div>
    <div id="subtitle"></div>
    <div class="mode-switch">
        <label class="switch">
            <input type="checkbox" id="modeToggle">
            <span class="slider"></span>
        </label>
        <span id="modeLabel">Normal-Modus</span>
    </div>

    <input type="text" id="agentInput" placeholder="Direkte Anweisung an Aki..." style="display:none;">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
        }
    }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
